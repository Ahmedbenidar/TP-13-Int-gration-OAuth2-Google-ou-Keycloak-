server:
  port: 8100
  servlet:
    session:
      cookie:
        name: PORTAIL_SESSION
        same-site: lax

spring:
  application:
    name: portail-identite-oauth2
  thymeleaf:
    cache: false
  security:
    oauth2:
      client:
        registration:
          usmba:
            provider: usmba
            client-id: portail-identite-client
            client-secret: usmba-portail-secret-2024
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: USMBA
            scope:
              - openid
              - profile
              - email
        provider:
          usmba:
            issuer-uri: http://localhost:8280/realms/usmba-realm
            user-name-attribute: preferred_username

logging:
  level:
    org.springframework.security.oauth2: INFO
